name: History macOS layout check

on:
  push:
    branches:
      - preview/10328-history-mac

permissions:
  contents: read

jobs:
  history-layout:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build test-instrumented Apple Silicon app
        run: >-
          pnpm tauri build --ci --target aarch64-apple-darwin --features history-e2e --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'
      - name: Exercise History in macOS WKWebView
        run: >-
          python3 scripts/history_macos_e2e.py
          --app target/aarch64-apple-darwin/release/bundle/macos/DBX.app
          --output history-macos-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DBX-history-macos-results
          path: history-macos-results/
          if-no-files-found: warn
          retention-days: 7
